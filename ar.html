<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }

  /* Растягиваем видеофон камеры на весь экран */
  .arjs-video {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    object-fit: cover !important;
    z-index: 0 !important;
  }

  /* Сцена поверх видео */
  a-scene, .a-canvas {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 1 !important;
    background: transparent !important;
  }

  .ar-video { position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; opacity: 0.01; }

  #backBtn {
    position: fixed; top: 12px; left: 12px; z-index: 999999;
    padding: 10px 16px; border-radius: 20px;
    background: #000; color: #fff;
    border: 1px solid #4fc3f7;
    font-family: Arial, sans-serif; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>

  <button id="backBtn" onclick="window.location.replace('index.html')">← Выйти</button>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth: 640; sourceHeight: 480; displayWidth: 640; displayHeight: 480;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
    style="width:100%; height:100%;">

    <a-marker type="pattern" url="1-building.patt">
      <a-video src="#v1" position="0 0 0" width="3" height="1.7" rotation="-90 0 0"></a-video>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <video id="v1" class="ar-video" src="1-building.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>

  <script>
    // Растягиваем видеофон камеры после загрузки AR.js
    window.addEventListener('load', function() {
      setTimeout(function() {
        var arVideo = document.querySelector('.arjs-video');
        if (arVideo) {
          arVideo.style.position = 'fixed';
          arVideo.style.top = '0';
          arVideo.style.left = '0';
          arVideo.style.width = '100vw';
          arVideo.style.height = '100vh';
          arVideo.style.objectFit = 'cover';
          arVideo.style.zIndex = '0';
        }
      }, 1500);
    });
  </script>

</body>
</html>
