<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR Test</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #backBtn {
    position: fixed; top: 12px; left: 12px; z-index: 999999;
    padding: 10px 16px; border-radius: 20px;
    background: #000; color: #fff;
    border: 1px solid #4fc3f7;
    font-family: Arial, sans-serif; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>

  <button id="backBtn" onclick="window.location.replace('index.html')">← Выйти</button>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    style="width:100%; height:100%;">

    <a-box position="0 0.5 -2" color="#4fc3f7" scale="0.5 0.5 0.5"></a-box>
    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
